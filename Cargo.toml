[package]
name = "repeated"
version = "0.1.4"
authors = ["Mika Sanchez <keyneom122@hotmail.com>"]
edition = "2021"
rust-version = "1.68"
license = "MIT"
readme = "README.md"
description = "Procedural macro for repeating a code template over numeric ranges or enumerated token lists"
documentation = "https://docs.rs/repeated"
homepage = "https://github.com/keyneom/repeated"
repository = "https://github.com/keyneom/repeated"
keywords = ["repeat", "macro", "duplicate", "template", "proc-macro"]
categories = ["rust-patterns", "development-tools::procedural-macro-helpers"]
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE", "examples/**/*", "tests/**/*"]

[lib]
proc-macro = true

[dependencies]
# Keep syn lean: we only parse a custom mini-DSL, not the full Rust AST.
syn = { version = "2", default-features = false, features = ["parsing", "proc-macro", "clone-impls"] }
proc-macro2 = "1"

[dev-dependencies]
trybuild = "1"
