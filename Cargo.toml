[package]
name = "repeated"
version = "0.1.3"
authors = ["Mika Sanchez <keyneom122@hotmail.com>"]
license = "MIT"
readme = "README.md"
description = """
Allows you to repeat a block of code a number of times.
"""

keywords = ["repeat", "code", "macro", "duplicate", "template"]

categories = ["rust-patterns"]

documentation = "https://docs.rs/repeated"
homepage = "https://github.com/keyneom/repeated"
repository = "https://github.com/keyneom/repeated"

edition = "2021"
rust-version = "1.68"

[badges]
maintenance = { status = "experimental" }

[lib]
proc-macro = true

[dependencies]
# Keep syn lean: we only parse a custom mini-DSL, not the full Rust AST.
syn = { version = "2", default-features = false, features = ["parsing", "proc-macro", "clone-impls"] }
proc-macro2 = "1"

[dev-dependencies]
trybuild = "1"
